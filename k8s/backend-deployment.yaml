# Ferrari F1 Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrari-backend
  namespace: ferrari-f1
  labels:
    app: ferrari-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ferrari-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ferrari-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/shelaratharva404/ferrari-f1/ferrari-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: ferrari-secrets
                  key: mongodb-uri
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: ferrari-config
                  key: frontend-url
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ferrari-backend-svc
  namespace: ferrari-f1
spec:
  selector:
    app: ferrari-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
  type: ClusterIP
