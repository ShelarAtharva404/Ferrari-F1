apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ferrari-ingress
  namespace: ferrari-f1
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - ferrari-f1.yourdomain.com
      secretName: ferrari-tls
  rules:
    - host: ferrari-f1.yourdomain.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: ferrari-backend-svc
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ferrari-frontend-svc
                port:
                  number: 80
---
apiVersion: v1
kind: Namespace
metadata:
  name: ferrari-f1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ferrari-config
  namespace: ferrari-f1
data:
  frontend-url: "https://ferrari-f1.yourdomain.com"
---
# NOTE: Create the secret with:
# kubectl create secret generic ferrari-secrets \
#   --from-literal=mongodb-uri="mongodb+srv://..." \
#   -n ferrari-f1
