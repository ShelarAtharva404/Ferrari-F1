# Ferrari F1 Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ferrari-frontend
  namespace: ferrari-f1
  labels:
    app: ferrari-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ferrari-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ferrari-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/shelaratharva404/ferrari-f1/ferrari-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ferrari-frontend-svc
  namespace: ferrari-f1
spec:
  selector:
    app: ferrari-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
